[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openhouse-lance-sidecar"
version = "0.1.0"
description = "Lance sidecar service for OpenHouse - wraps LanceDB operations as a REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "lancedb>=0.8.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120

[tool.hatch.build.targets.wheel]
packages = ["src/lance_sidecar"]
